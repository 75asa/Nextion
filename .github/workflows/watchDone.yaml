name: watchDone

on:
  workflow_dispatch:
  # Paused until the Notion client v5 upgrade (#72) is verified on a real
  # database with a manual run. Uncomment to resume the schedule (#65).
  # schedule:
  #   - cron: '*/10 * * * *'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  NOTION_KEY: ${{ secrets.NOTION_KEY }}
  NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
  # optional: empty values fall back to the defaults in src/Config.ts
  NOTION_DATA_SOURCE_ID: ${{ secrets.NOTION_DATA_SOURCE_ID }}
  NOTION_NAME_PROP: ${{ secrets.NOTION_NAME_PROP }}
  NOTION_STATUS_PROP: ${{ secrets.NOTION_STATUS_PROP }}
  NOTION_ASSIGN_PROP: ${{ secrets.NOTION_ASSIGN_PROP }}
  NOTION_NO_IMAGE_URL: ${{ secrets.NOTION_NO_IMAGE_URL }}

jobs:
  watchDone:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - uses: ./.github/actions/node-setup
    - run: pnpm start:watchDone